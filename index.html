    <!-- Báo lỗi lên màn hình thay vì để trang trắng -->
    <script>
      (function () {
        function show(msg) {
          var a = document.getElementById("app");
          if (!a) return;
          a.innerHTML =
            '<div style="max-width:680px;margin:30px auto;padding:20px;border:2px dashed #d6403f;border-radius:12px;background:#fff;color:#14213d">' +
            '<h2 style="margin:0 0 8px">⚠️ Trang không chạy được</h2><p style="margin:0 0 8px">' +
            msg +
            "</p>" +
            '<p style="margin:0;font-size:14px">Gợi ý: (1) mở bằng http (GitHub Pages hoặc <code>npx serve .</code>), không mở file trực tiếp; ' +
            "(2) kiểm tra mạng có vào được cdn.jsdelivr.net; (3) mở F12 → Console để xem chi tiết.</p></div>";
        }
        window.addEventListener("error", function (e) {
          show("Lỗi: " + (e.message || e.error));
        });
        window.addEventListener("unhandledrejection", function (e) {
          show("Lỗi: " + ((e.reason && e.reason.message) || e.reason));
        });
        if (location.protocol === "file:")
          show(
            "Bạn đang mở file trực tiếp (file://). Trình duyệt chặn ES Modules ở chế độ này.",
          );
        setTimeout(function () {
          var a = document.getElementById("app");
          if (a && !a.children.length)
            show(
              "Sau 8 giây vẫn chưa có nội dung — có thể không tải được thư viện Supabase từ CDN hoặc URL/key trong js/config.js sai.",
            );
        }, 8000);
      })();
    </script>
